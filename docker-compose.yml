services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep
      POSTGRES_DB: prep
    ports:
      - "5432:5432"
    volumes:
      - prep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep -d prep"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional S3-compatible private storage for local development
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: prepminio
      MINIO_ROOT_PASSWORD: prepminio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prep_minio_data:/data

volumes:
  prep_pg_data:
  prep_minio_data:
